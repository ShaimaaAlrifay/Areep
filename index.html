<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ==========================================================
         Static metadata.

         This block is not a duplicate of <Seo> in src/components — it is
         the only metadata that Open Graph scrapers (WhatsApp, LinkedIn,
         Facebook, Slack, X) ever read, because none of them execute the
         JavaScript that renders this SPA. <Seo> updates these same tags in
         place at runtime for the browser tab and for JS-rendering crawlers.

         Tags that require knowing the production origin — canonical,
         og:url, og:image, twitter:image — are deliberately absent here and
         are injected at build time by vite/seoPlugin.js from VITE_SITE_URL.
         Hardcoding a guessed domain would be worse than omitting them.
         ========================================================== -->
    <title>أريب — من كلام العميل إلى PRD جاهز للتنفيذ</title>
    <meta
      name="description"
      content="أريب أداة ذكاء المتطلبات لمحللي ومدراء المنتج: حوّل جلسة اكتشاف المتطلبات مع عميلك إلى وثيقة PRD عربية منظّمة وجاهزة للتصدير."
    />

    <!-- Icons, regenerated with `npm run brand` alongside the social image.
         The SVG scales to every size and is listed first because browsers
         prefer it; the raster pair exists because iOS/Safari ignores SVG
         favicons. All three are the same picture: the white mark on the
         brand's near-black. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0a0a0b" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="أريب" />
    <meta property="og:locale" content="ar_AR" />
    <meta property="og:title" content="أريب — من كلام العميل إلى PRD جاهز للتنفيذ" />
    <meta
      property="og:description"
      content="أريب أداة ذكاء المتطلبات لمحللي ومدراء المنتج: حوّل جلسة اكتشاف المتطلبات مع عميلك إلى وثيقة PRD عربية منظّمة وجاهزة للتصدير."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
