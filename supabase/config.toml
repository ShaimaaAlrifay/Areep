# Supabase project configuration.
#
# Only the Edge Functions section is set deliberately here — Auth, the
# database and Storage are managed from the dashboard and are untouched by
# this migration.

project_id = "dqtgcqlaaagimghpiuix"

# verify_jwt = true is the platform default, and is stated explicitly here
# because it is the security property this migration exists to gain. The
# Express version of /api/discovery was reachable by anyone who knew the
# URL — it spent Gemini and Groq quota for unauthenticated callers. With
# this, the platform rejects any request without a valid Supabase Auth JWT
# before the handler (and therefore any API key) is ever reached.
#
# supabase.functions.invoke() attaches the signed-in user's access token
# automatically, so the frontend needs no extra code for this.

[functions.discovery]
verify_jwt = true

[functions.prd]
verify_jwt = true

# The owner dashboard's only data source. verify_jwt is the first of two
# gates — it rejects anything without a valid Supabase Auth JWT before the
# handler runs. The second gate is inside the handler: the caller's id must
# be in app_admins with is_super_admin, checked with the service role. Gate
# one alone would not be enough, since the publishable key is in the bundle
# and any signed-in user carries a valid JWT.
[functions.admin-analytics]
verify_jwt = true

# Same reasoning as admin-analytics — the second gate (app_admins) is what
# actually matters, this just confirms the platform requires a real JWT.
[functions.admin-settings]
verify_jwt = true

# No second gate needed here, unlike admin-settings — get-my-usage only
# ever answers with the caller's own id (taken from their verified JWT),
# so any signed-in user is exactly who is allowed to call it.
[functions.get-my-usage]
verify_jwt = true
