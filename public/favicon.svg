<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- The mark is white, so it ships on the brand's own near-black rather
       than transparent. A transparent white mark is invisible against light
       browser chrome, and a favicon is the one surface whose background we
       do not control — so the tile carries it.

       The mark fills 88% of the tile. It used to fill 58%, which looked
       balanced at the 512px this file is authored at and was illegible at
       the 16px a browser tab actually renders: roughly 9px of artwork
       inside 7px of padding, which reads as a grey smudge rather than a
       logo. A favicon is designed at its smallest size or not at all.

       scripts/generate-brand-assets.mjs uses the same 88% for the two
       raster icons, so all three remain the same picture. -->
  <rect width="512" height="512" fill="#0a0a0b"/>
  <g transform="translate(30.72 55.75) scale(1.41667)">
    <path d="M195.985 274.56C172.835 285.86 144.975 285.42 122.455 274.92C109.155 268.71 103.715 256.79 106.545 242.98C111.755 217.58 141.985 183.76 159.845 183.76C178.715 183.76 206.995 218.16 211.625 244.35C213.875 257.06 208.905 268.25 195.985 274.56Z" fill="white"/>
